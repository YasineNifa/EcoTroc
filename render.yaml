databases:
  - name: ecotroc-db
    databaseName: ecotroc
    plan: free

services:
  - type: web
    name: ecotroc-backend
    runtime: docker
    repo: https://github.com/YasineNifa/EcoTroc
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/countries/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecotroc-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: https://eco-troc.vercel.app,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://eco-troc.vercel.app
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_EMAIL
        value: demo@ecotroc.app
      - key: DEMO_PASSWORD
        value: DemoPass123!
      - key: DEMO_TOKEN_BALANCE
        value: "100"
